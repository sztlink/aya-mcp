[workspace]
members = [
  "crates/aya-contracts",
  "crates/aya-public-mcp",
  "crates/aya-worker-mcp",
  "crates/aya-workcell",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/sztlink/aya-mcp"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
jsonschema = { version = "0.56.0", default-features = false }
nix = { version = "0.30.1", features = ["process", "signal"] }
rmcp = { version = "=3.3.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

aya-contracts = { path = "crates/aya-contracts" }
